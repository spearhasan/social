<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101321">
  <meta name="description" content="Spear Hasan-এর অফিসিয়াল প্রোফাইল ও সামাজিক যোগাযোগের লিংক।">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Spear Hasan | Official Profile">
  <meta property="og:description" content="Spear Hasan-এর অফিসিয়াল প্রোফাইল ও সামাজিক যোগাযোগের লিংক।">
  <meta property="og:url" content="https://spearhasan.github.io/social/social-embed.html">
  <meta property="og:image" content="https://spearhasan.github.io/social/y.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://spearhasan.github.io/social/y.png">
  <title>Spear Hasan | Official Profile</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0b1020;
      --surface: rgba(21, 27, 46, .92);
      --text: #f6f7fb;
      --muted: #b9c1d3;
      --line: rgba(255, 255, 255, .13);
      --accent: #79f2cb;
      --shadow: 0 28px 80px rgba(0, 0, 0, .42);
    }
    * { box-sizing: border-box; }
    html { min-width: 280px; min-height: 100%; background: var(--page); }
    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(18px, 5vw, 56px) 14px;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 15%, rgba(121, 242, 203, .13), transparent 36%),
        radial-gradient(ellipse at 85% 80%, rgba(120, 112, 255, .18), transparent 38%),
        var(--page);
      font-family: system-ui, -apple-system, "Noto Sans Bengali", "Noto Sans", sans-serif;
    }
    a { color: inherit; }
    .profile-card {
      width: min(100%, 470px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .cover {
      display: block;
      width: 100%;
      height: clamp(130px, 34vw, 188px);
      object-fit: cover;
      object-position: center;
      background: #25283a;
    }
    .content { padding: 0 28px 26px; text-align: center; }
    .avatar {
      width: 116px;
      height: 116px;
      margin: -58px auto 12px;
      display: block;
      position: relative;
      border: 4px solid #151b2e;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 30%;
      background: #282e43;
      box-shadow: 0 8px 26px rgba(0, 0, 0, .4);
    }
    h1 { margin: 0; font-size: clamp(1.7rem, 7vw, 2.2rem); letter-spacing: -.035em; line-height: 1.2; }
    .verified { display: inline-grid; place-items: center; width: 19px; height: 19px; margin-left: 5px; border-radius: 50%; color: #08151a; background: var(--accent); font-size: 13px; vertical-align: 3px; }
    .tagline { margin: 8px 0 22px; color: var(--muted); font-size: .98rem; line-height: 1.65; }
    .links { display: grid; gap: 11px; }
    .social-link, .share-button {
      min-height: 51px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      background: rgba(255, 255, 255, .045);
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
      cursor: pointer;
    }
    .social-link:hover, .share-button:hover { transform: translateY(-2px); border-color: rgba(121, 242, 203, .55); background: rgba(121, 242, 203, .1); }
    .social-link svg, .share-button svg { width: 20px; height: 20px; flex: 0 0 auto; }
    .facebook svg { color: #82a8ff; }
    .tiktok svg { color: #fff; }
    .youtube svg { color: #ff7373; }
    .email svg { color: var(--accent); }
    .share-button { width: 100%; margin-top: 13px; color: var(--accent); }
    .footer { margin: 18px 0 0; color: #8d96ab; font-size: .78rem; }
    .notice {
      position: fixed;
      inset: auto 14px 18px;
      width: fit-content;
      max-width: calc(100vw - 28px);
      margin: auto;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: #202941;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
      font-size: .9rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .2s ease, transform .2s ease;
    }
    .notice.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 360px) {
      .content { padding-inline: 18px; }
      .profile-card { border-radius: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="profile-card" aria-labelledby="profile-name">
    <img class="cover" src="https://spearhasan.github.io/social/pngs/cover.png" alt="Spear Hasan-এর কভার ছবি" fetchpriority="high">
    <section class="content">
      <img class="avatar" src="https://spearhasan.github.io/social/y.png" alt="Spear Hasan-এর প্রোফাইল ছবি" fetchpriority="high">
      <h1 id="profile-name">Spear Hasan <span class="verified" aria-label="Verified">✓</span></h1>
      <p class="tagline">সত্য বলি, ভয় পাই না।<br>আমার অফিসিয়াল সামাজিক যোগাযোগের লিংক</p>

      <nav class="links" aria-label="সামাজিক যোগাযোগের লিংক">
        <a class="social-link facebook" href="https://www.facebook.com/spearhasan1" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.4 21v-8.2h2.8l.4-3.2h-3.2v-2c0-.9.3-1.6 1.6-1.6h1.7V3.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.3H7.2v3.2H10V21h3.4Z"/></svg>
          <span>Facebook · Spear Hasan</span>
        </a>
        <a class="social-link facebook" href="https://www.facebook.com/spearhasan2" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.4 21v-8.2h2.8l.4-3.2h-3.2v-2c0-.9.3-1.6 1.6-1.6h1.7V3.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.3H7.2v3.2H10V21h3.4Z"/></svg>
          <span>Facebook · Page</span>
        </a>
        <a class="social-link tiktok" href="https://www.tiktok.com/@spear_hasan" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.6 8.3a7.1 7.1 0 0 1-4.4-1.5v7.1a5.6 5.6 0 1 1-5.6-5.6c.4 0 .8 0 1.2.1v3.1a2.6 2.6 0 1 0 1.7 2.4V2.5h3.1c.3 2.1 1.8 3.7 4 4v1.8Z"/></svg>
          <span>TikTok · @spear_hasan</span>
        </a>
        <a class="social-link youtube" href="https://youtube.com/@spear_hasan" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.6 3.6 12 3.6 12 3.6s-7.6 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.8.5 9.4.5 9.4.5s7.6 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.7V8.3l6.3 3.7-6.3 3.7Z"/></svg>
          <span>YouTube · Spear Hasan</span>
        </a>
        <a class="social-link email" href="mailto:spearhasan@gmail.com?subject=যোগাযোগ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm9 7.2L20.5 7h-17l8.5 5.2Zm0 2.2L3 8.1V17h18V8.1l-9 6.3Z"/></svg>
          <span>ইমেইল করুন</span>
        </a>
      </nav>

      <button class="share-button" id="shareButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 16a3 3 0 0 0-2.6 1.5l-6.8-4a3.2 3.2 0 0 0 0-3l6.8-4A3 3 0 1 0 14.5 5l-6.8 4a3 3 0 1 0 0 6l6.8 4A3 3 0 1 0 18 16Z"/></svg>
        <span>প্রোফাইল শেয়ার করুন</span>
      </button>
      <p class="footer">© Spear Hasan · Official profile</p>
    </section>
  </main>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const shareUrl = "https://spearhasan.github.io/social/";
      const button = document.getElementById("shareButton");
      const notice = document.getElementById("notice");
      let noticeTimer;

      function showNotice(message) {
        notice.textContent = message;
        notice.classList.add("visible");
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => notice.classList.remove("visible"), 2200);
      }

      button.addEventListener("click", async () => {
        if (navigator.share) {
          try {
            await navigator.share({ title: "Spear Hasan", text: "Spear Hasan-এর অফিসিয়াল প্রোফাইল", url: shareUrl });
            return;
          } catch (error) {
            if (error && error.name === "AbortError") return;
          }
        }
        try {
          await navigator.clipboard.writeText(shareUrl);
          showNotice("প্রোফাইল লিংক কপি হয়েছে");
        } catch (error) {
          const field = document.createElement("textarea");
          field.value = shareUrl;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const copied = document.execCommand("copy");
          field.remove();
          showNotice(copied ? "প্রোফাইল লিংক কপি হয়েছে" : shareUrl);
        }
      });
    })();
  </script>
</body>
</html>
