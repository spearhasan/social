<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6fb">
  <meta name="description" content="Spear Hasan-এর অফিসিয়াল প্রোফাইল ও সামাজিক যোগাযোগের লিংক।">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Spear Hasan | Official Profile">
  <meta property="og:description" content="Spear Hasan-এর অফিসিয়াল প্রোফাইল ও সামাজিক যোগাযোগের লিংক।">
  <meta property="og:url" content="https://spearhasan.github.io/social/social-embed.html">

  <title>Spear Hasan | Official Profile</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f6fb;
      --surface: #fff;
      --soft: #f7f8fc;
      --ink: #162039;
      --muted: #71809b;
      --line: #e6eaf2;
      --accent: #5c68ee;
      --mint: #18a985;
      --shadow: 0 25px 75px rgba(39, 53, 87, .15);
    }
    * { box-sizing: border-box; }
    html { min-width: 280px; min-height: 100%; background: var(--page); }
    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(18px, 5vw, 52px) 14px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 14%, rgba(92, 104, 238, .13), transparent 34rem),
        radial-gradient(ellipse at 90% 85%, rgba(24, 169, 133, .10), transparent 32rem),
        var(--page);
      font-family: "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .icon { width: 20px; height: 20px; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .profile-card { width: min(100%, 490px); overflow: hidden; border: 1px solid rgba(225, 230, 240, .92); border-radius: 27px; background: var(--surface); box-shadow: var(--shadow); }
    .cover-wrap { height: auto; aspect-ratio: 3264 / 1226; position: relative; background: #dbe1ec; }
    .cover { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; }
    .cover-shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(14, 22, 41, .34)); }
    .page-label { position: absolute; top: 15px; right: 15px; padding: 7px 10px; display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; color: #fff; background: rgba(22,31,54,.45); backdrop-filter: blur(12px); font-size: 9px; font-weight: 800; letter-spacing: .12em; }
    .online-dot { width: 7px; height: 7px; border-radius: 50%; background: #71f0c4; box-shadow: 0 0 0 3px rgba(113,240,196,.17); }
    .content { padding: 0 27px 25px; text-align: center; }
    .avatar { width: 106px; height: 106px; margin: -51px auto 10px; position: relative; display: block; border: 5px solid var(--surface); border-radius: 50%; object-fit: cover; object-position: center 26%; background: #e6eaf2; box-shadow: 0 8px 23px rgba(18,28,51,.2); }
    .eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .15em; }
    h1 { margin: 0; display: flex; justify-content: center; align-items: center; gap: 7px; font-size: clamp(25px, 7vw, 31px); font-weight: 800; letter-spacing: -.05em; }
    .verified-badge { width: 20px; height: 20px; flex: 0 0 auto; display: inline-block; background: url("https://spearhasan.github.io/social/pngs/verified-badge.svg") center / contain no-repeat; }
    .tagline { margin: 7px 0 20px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .social-link { min-width: 0; min-height: 62px; padding: 9px 10px; display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--surface); text-align: left; text-decoration: none; transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease; }
    .social-link:hover { transform: translateY(-2px); border-color: rgba(92,104,238,.36); background: var(--soft); box-shadow: 0 8px 20px rgba(39,53,87,.08); }
    .social-icon { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 11px; }
    .social-icon .icon { width: 18px; height: 18px; }
    .facebook .social-icon { color: #2476e8; background: #eaf2ff; }
    .tiktok .social-icon { color: #131722; background: #f0f1f5; }
    .youtube .social-icon { color: #ed3f4b; background: #fff0f1; }
    .email .social-icon { color: #139476; background: #e8f8f3; }
    .link-copy { min-width: 0; }
    .link-copy strong, .link-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link-copy strong { font-size: 10px; font-weight: 800; }
    .link-copy small { margin-top: 2px; color: var(--muted); font-size: 8px; }
    .email { grid-column: 1 / -1; justify-content: center; }
    .share-button { width: 100%; min-height: 47px; margin-top: 13px; padding: 10px 16px; display: flex; align-items: center; justify-content: center; gap: 9px; border: 0; border-radius: 14px; color: #fff; background: linear-gradient(105deg, #6674f4, #535fdd); box-shadow: 0 9px 20px rgba(92,104,238,.23); font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; }
    .share-button:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(92,104,238,.3); }
    .footer { margin: 16px 0 0; color: var(--muted); font-size: 9px; }
    .notice { position: fixed; inset: auto 14px 18px; width: fit-content; max-width: calc(100vw - 28px); margin: auto; padding: 10px 15px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: #fff; box-shadow: var(--shadow); font-size: 12px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .2s ease, transform .2s ease; }
    .notice.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 370px) { .content { padding-inline: 17px; } .links { grid-template-columns: 1fr; } .email { grid-column: auto; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
    <symbol id="facebook" viewBox="0 0 24 24"><path fill="currentColor" d="M13.4 21v-8.2h2.8l.4-3.2h-3.2v-2c0-.9.3-1.6 1.6-1.6h1.7V3.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.3H7.2v3.2H10V21h3.4Z"/></symbol>
    <symbol id="tiktok" viewBox="0 0 24 24"><path fill="currentColor" d="M19.6 8.3a7.1 7.1 0 0 1-4.4-1.5v7.1a5.6 5.6 0 1 1-5.6-5.6c.4 0 .8 0 1.2.1v3.1a2.6 2.6 0 1 0 1.7 2.4V2.5h3.1c.3 2.1 1.8 3.7 4 4v1.8Z"/></symbol>
    <symbol id="youtube" viewBox="0 0 24 24"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.6 3.6 12 3.6 12 3.6s-7.6 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.8.5 9.4.5 9.4.5s7.6 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.7V8.3l6.3 3.7-6.3 3.7Z"/></symbol>
    <symbol id="email" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4m-6.6 7 6.6 4.4"/></symbol>
  </svg>
  <main class="profile-card" aria-labelledby="profile-name">
    <div class="cover-wrap">
      <img class="cover" src="https://spearhasan.github.io/social/pngs/cover.png" alt="Spear Hasan-এর কভার ছবি" fetchpriority="high">
      <div class="cover-shade"></div>
      <span class="page-label"><span class="online-dot"></span> OFFICIAL PAGE</span>
    </div>
    <section class="content">
      <img class="avatar" src="https://spearhasan.github.io/social/pngs/spear-hasan-profile.jpg" alt="Spear Hasan-এর প্রোফাইল ছবি" fetchpriority="high">
      <p class="eyebrow">CREATOR · BANGLADESH</p>
      <h1 id="profile-name">Spear Hasan <span class="verified-badge" role="img" aria-label="Verified" title="Verified"></span></h1>
      <p class="tagline">সত্য বলি, ভয় পাই না।<br>আমার অফিসিয়াল সামাজিক যোগাযোগের লিংক</p>
      <nav class="links" aria-label="সামাজিক যোগাযোগের লিংক">
        <a class="social-link facebook" href="https://www.facebook.com/spearhasan1" target="_blank" rel="noopener noreferrer"><span class="social-icon"><svg class="icon"><use href="#facebook"/></svg></span><span class="link-copy"><strong>Spear Hasan</strong><small>Facebook profile</small></span></a>
        <a class="social-link facebook" href="https://www.facebook.com/spearhasan2" target="_blank" rel="noopener noreferrer"><span class="social-icon"><svg class="icon"><use href="#facebook"/></svg></span><span class="link-copy"><strong>Facebook</strong><small>Official page</small></span></a>
        <a class="social-link tiktok" href="https://www.tiktok.com/@spear_hasan" target="_blank" rel="noopener noreferrer"><span class="social-icon"><svg class="icon"><use href="#tiktok"/></svg></span><span class="link-copy"><strong>TikTok</strong><small>@spear_hasan</small></span></a>
        <a class="social-link youtube" href="https://youtube.com/@spear_hasan" target="_blank" rel="noopener noreferrer"><span class="social-icon"><svg class="icon"><use href="#youtube"/></svg></span><span class="link-copy"><strong>YouTube</strong><small>Spear Hasan</small></span></a>
        <a class="social-link email" href="mailto:spearhasan@gmail.com?subject=যোগাযোগ"><span class="social-icon"><svg class="icon"><use href="#email"/></svg></span><span class="link-copy"><strong>ইমেইল করুন</strong><small>spearhasan@gmail.com</small></span></a>
      </nav>
      <button class="share-button" id="shareButton" type="button"><svg class="icon"><use href="#share"/></svg><span>প্রোফাইল শেয়ার করুন</span></button>
      <p class="footer">© Spear Hasan · Official profile</p>
    </section>
  </main>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const shareUrl = "https://spearhasan.github.io/social/";
      const button = document.getElementById("shareButton");
      const notice = document.getElementById("notice");
      let noticeTimer;
      function showNotice(message) {
        notice.textContent = message;
        notice.classList.add("visible");
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => notice.classList.remove("visible"), 2200);
      }
      button.addEventListener("click", async () => {
        if (navigator.share) {
          try {
            await navigator.share({ title: "Spear Hasan", text: "Spear Hasan-এর অফিসিয়াল প্রোফাইল", url: shareUrl });
            return;
          } catch (error) {
            if (error && error.name === "AbortError") return;
          }
        }
        try {
          await navigator.clipboard.writeText(shareUrl);
          showNotice("প্রোফাইল লিংক কপি হয়েছে");
        } catch (error) {
          const field = document.createElement("textarea");
          field.value = shareUrl;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const copied = document.execCommand("copy");
          field.remove();
          showNotice(copied ? "প্রোফাইল লিংক কপি হয়েছে" : shareUrl);
        }
      });
    })();
  </script>
</body>
</html>
