<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic Meta -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Title (70 characters max for SEO) -->
  <title>Spear Hasan | Official Website - YouTuber, Content Creator & Storyteller</title>
  
  <!-- SEO Description (160 characters max) -->
  <meta name="description" content="Welcome to Spear Hasan's official site — YouTuber, content creator, and digital storyteller. Explore videos, blogs, and exclusive creative work." />
  
  <!-- Keywords (use relevant long-tail + short-tail) -->
  <meta name="keywords" content="Spear Hasan, spearhasan, YouTube creator, digital storyteller, Bangladesh influencer, Hasan Vlog, content creator" />
  
  <!-- Author -->
  <meta name="author" content="Spear Hasan" />
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://spearhasan.github.io/in" />
  
  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Spear Hasan | Official Website - YouTuber & Creator" />
  <meta property="og:description" content="Discover Spear Hasan — storyteller, YouTuber, and creative digital artist." />
  <meta property="og:image" content="https://spearhasan.github.io/in/cover.png" />
  <meta property="og:url" content="https://spearhasan.github.io/in" />
  <meta property="og:site_name" content="Spear Hasan Web" />
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Spear Hasan | Official Website - YouTuber & Creator" />
  <meta name="twitter:description" content="Follow Spear Hasan's creative world of videos, vlogs, and storytelling." />
  <meta name="twitter:image" content="https://spearhasan.github.io/in/pngs/cover.png" />
  <meta name="twitter:site" content="@spearhasan" />
  
  <!-- Structured Data (JSON-LD for Google Knowledge Panel) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Spear Hasan",
      "url": "https://spearhasan.github.io/in",
      "image": "https://spearhasan.github.io/in/cover.png",
      "sameAs": [
        "https://www.youtube.com/@spear_hasan",
        "https://www.instagram.com/spearhasan",
        "https://www.facebook.com/spearhasan",
        "https://www.tiktok.com/@spear_hasan"
      ],
      "jobTitle": "Content Creator",
      "description": "YouTuber, storyteller, and creative influencer from Bangladesh."
    }

  <!-- Fonts and Icons -->

  <link rel="stylesheet" href="style.css" />
  
  <!-- Favicon -->

  <!-- Robots (ensure search visibility) -->

  <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
